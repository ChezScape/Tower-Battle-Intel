<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Tower Battle Intel - Battle Report Intelligence Dashboard"
    >

    <title>
        Tower Battle Intel
    </title>

    <script>
        (function () {
            var width = window.innerWidth || document.documentElement.clientWidth || 1024;
            var coarse = false;

            try {
                coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
            } catch (error) {
                coarse = false;
            }

            var ua = navigator.userAgent || "";
            var mobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
            var mode = (width <= 760 || (coarse && width <= 1024) || mobileUA)
                ? "mobile"
                : "desktop";

            window.TowerBattleIntelDeviceMode = mode;

            document.documentElement.setAttribute("data-device-mode", mode);
            document.documentElement.classList.add("device-" + mode);

            document.write(
                '<link rel="stylesheet" href="./' +
                (mode === "mobile" ? "mobile.css" : "desktop.css") +
                '">'
            );
        }());
    </script>

</head>

<body>

    <div id="app">

        <button
            id="toggleDebug"
            type="button"
            hidden
            aria-hidden="true"
            tabindex="-1"
        >
            Debug
        </button>

        <main class="layout">

            <section
                id="dashboard"
                aria-live="polite"
            >
                <div class="tbi-card">
                    <h2>System</h2>
                    <p>Waiting for battle reports...</p>
                </div>
            </section>

        </main>

        <section class="input-section" id="mobileReportSheet">

            <div
                class="mobile-input-sheet-handle"
                data-device-only="mobile"
                hidden
                aria-hidden="true"
            >

                <div>
                    <span class="mobile-sheet-kicker">Command Deck</span>
                    <strong>Report Console</strong>
                </div>

                <button
                    id="mobileInputClose"
                    type="button"
                    aria-label="Close report console"
                >
                    Close
                </button>

            </div>

            <div class="input-header">

                <div class="section-title">
                    Battle Report Input
                </div>

                <div class="section-subtitle">
                    Paste one or more exported battle reports below. Saved reports appear in Battle History Trace. Choose A as the baseline and B as the run to compare against it. Deltas show A - B.
                </div>

            </div>

            <textarea
                id="input"
                spellcheck="false"
                placeholder="Paste Battle Report Here..."
                aria-label="Battle report input"
            ></textarea>

            <div class="input-actions">

                <button
                    id="saveReport"
                    type="button"
                >
                    Save Report
                </button>

                <label
                    class="build-style-wrap build-style-inline"
                    for="buildStyleSelect"
                >

                    <span>
                        Build
                    </span>

                    <select
                        id="buildStyleSelect"
                        aria-label="Select build style"
                    >

                        <option value="unknown">
                            Unknown
                        </option>

                        <option value="health_ehp">
                            Health / EHP
                        </option>

                        <option value="blender">
                            Blender
                        </option>

                        <option value="devo">
                            Devo
                        </option>

                        <option value="orb_devo">
                            Orb Devo
                        </option>

                        <option value="glass_cannon">
                            Glass Cannon
                        </option>

                        <option value="hybrid">
                            Hybrid
                        </option>

                    </select>

                </label>

                <button
                    id="clearInput"
                    type="button"
                >
                    Clear Input
                </button>

                <button
                    id="clearRuns"
                    type="button"
                >
                    Clear Runs
                </button>

            </div>

        </section>

        <div
            id="mobileSheetBackdrop"
            class="mobile-sheet-backdrop"
            data-device-only="mobile"
            data-start-hidden="true"
            hidden
            aria-hidden="true"
        ></div>

        <div
            id="mobileCommandRail"
            class="mobile-command-rail"
            data-device-only="mobile"
            data-start-hidden="true"
            hidden
            aria-hidden="true"
        >

            <button
                type="button"
                data-mobile-command="open-report"
            >
                Paste
            </button>

            <button
                type="button"
                data-mobile-command="save-report"
            >
                Save
            </button>

            <button
                type="button"
                data-mobile-command="clear-input"
            >
                Clear
            </button>

            <button
                type="button"
                data-mobile-command="history-tab"
            >
                History
            </button>

        </div>

        <button
            id="mobileReportFab"
            class="mobile-report-fab"
            type="button"
            aria-controls="mobileReportSheet"
            aria-expanded="false"
            data-device-only="mobile"
            hidden
        >
            Open Deck
        </button>

        <section
            id="debugPanel"
            aria-live="polite"
        ></section>

    </div>

    <script>
        (function () {
            var mode = window.TowerBattleIntelDeviceMode ||
                document.documentElement.getAttribute("data-device-mode") ||
                "desktop";

            document.querySelectorAll("[data-device-only]").forEach(function (element) {
                var matchesMode = element.getAttribute("data-device-only") === mode;
                var startsHidden = element.getAttribute("data-start-hidden") === "true";

                element.hidden = !matchesMode || startsHidden;

                if (startsHidden) {
                    element.setAttribute("aria-hidden", "true");
                }
            });

            document.body.classList.remove("mobile-report-open", "mobile-command-rail-open", "mobile-scroll-locked");
            document.documentElement.classList.remove("mobile-scroll-locked");
        }());
    </script>

    <script
        type="module"
        src="./app.js"
    ></script>

</body>
</html>
